<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系我们 - 宁夏揽岳喜行会展旅游有限责任公司</title>
  <meta name="description" content="联系宁夏揽岳喜行会展旅游有限责任公司，获取汽车租赁、接客、会务承办与餐饮服务方案。" />
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#17324d;
      --muted:#5d7286;
      --primary:#0f4c81;
      --primary2:#1c6ca8;
      --line:#dce6f0;
      --shadow:0 18px 45px rgba(15,76,129,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
    a{text-decoration:none;color:inherit}
    .wrap{width:min(1180px,92vw);margin:0 auto}
    header{
      position:sticky;top:0;z-index:10;
      background:rgba(245,247,251,.92);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      display:flex;justify-content:space-between;align-items:center;gap:18px;
      padding:18px 0;
    }
    .brand{font-weight:800;color:var(--primary);letter-spacing:.5px;font-size:18px}
    .menu{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:15px}
    .menu a:hover{color:var(--primary)}
    .hero{
      padding:64px 0 28px;
      background:linear-gradient(135deg, rgba(15,76,129,.92), rgba(28,108,168,.86));
      color:#fff;
    }
    h1{margin:0 0 14px;font-size:clamp(32px,4vw,48px);line-height:1.1}
    .lead{margin:0;max-width:46rem;color:rgba(255,255,255,.9);font-size:18px}
    section{padding:56px 0}
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:24px;
      align-items:start;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      box-shadow:var(--shadow);
    }
    .section-title{font-size:30px;margin:0 0 10px}
    .section-sub{margin:0 0 20px;color:var(--muted)}
    .info{
      display:grid;
      gap:14px;
      margin-top:18px;
    }
    .info div{
      padding:16px;
      border-radius:14px;
      background:#f7fbff;
      border:1px solid var(--line);
      color:var(--muted);
    }
    .field{display:grid;gap:10px;margin-bottom:12px}
    input,textarea{
      width:100%;
      padding:14px 15px;
      border:1px solid #cfdceb;
      border-radius:12px;
      font:inherit;
      background:#fff;
    }
    textarea{min-height:150px;resize:vertical}
    .btn{
      display:inline-block;
      background:var(--primary);
      color:#fff;
      border:0;
      padding:14px 22px;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
      width:100%;
    }
    .footer{
      padding:24px 0 40px;color:var(--muted);
      text-align:center;border-top:1px solid var(--line);
    }
    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
      .nav{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">宁夏揽岳喜行会展旅游有限责任公司</div>
      <nav class="menu">
        <a href="index.html">首页</a>
        <a href="services.html">业务服务</a>
        <a href="contact.html">联系我们</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1>联系我们</h1>
        <p class="lead">欢迎咨询汽车租赁、接客服务、会务承办与餐饮保障等业务，我们将尽快为您提供方案。</p>
      </div>
    </section>

    <section>
      <div class="wrap grid">
        <div class="panel">
          <h2 class="section-title" style="margin-top:0">联系信息</h2>
          <p class="section-sub">请替换为公司的真实联系方式。</p>
          <div class="info">
            <div>公司名称：宁夏揽岳喜行会展旅游有限责任公司</div>
            <div>电话：请替换为公司电话</div>
            <div>邮箱：请替换为公司邮箱</div>
            <div>地址：请替换为公司地址</div>
          </div>
        </div>

        <div class="panel">
          <h2 class="section-title" style="margin-top:0">提交需求</h2>
          <p class="section-sub">客户提交后会直接发送到你的邮箱。</p>

          <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE" />
            <input type="hidden" name="subject" value="宁夏揽岳喜行会展旅游有限责任公司 - 新咨询" />
            <input type="hidden" name="redirect" value="https://web3forms.com/success" />
            <input type="checkbox" name="botcheck" style="display:none;" />

            <div class="field">
              <input type="text" name="name" placeholder="您的姓名" required />
            </div>
            <div class="field">
              <input type="email" name="email" placeholder="邮箱地址" required />
            </div>
            <div class="field">
              <input type="tel" name="phone" placeholder="联系电话" required />
            </div>
            <div class="field">
              <input type="text" name="service" placeholder="需求类型，例如：汽车租赁 / 接客 / 会务 / 餐饮" />
            </div>
            <div class="field">
              <textarea name="message" placeholder="请填写需求说明，例如人数、日期、地点、车型等" required></textarea>
            </div>
            <button class="btn" type="submit">提交需求</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    © 2026 宁夏揽岳喜行会展旅游有限责任公司
  </footer>
</body>
</html>
